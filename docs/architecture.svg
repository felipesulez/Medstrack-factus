<svg width="680" height="740" viewBox="0 0 680 740" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── Actor headers ── -->
  <!-- Cliente -->
  <rect x="30" y="20" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="90" y="36" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Cliente</text>
  <text x="90" y="54" text-anchor="middle" font-size="11" fill="#5F5E5A">Medstrack</text>

  <!-- InvoiceController -->
  <rect x="195" y="20" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="265" y="36" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Invoice</text>
  <text x="265" y="54" text-anchor="middle" font-size="11" fill="#185FA5">Controller</text>

  <!-- FactusService -->
  <rect x="380" y="20" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="445" y="36" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Factus</text>
  <text x="445" y="54" text-anchor="middle" font-size="11" fill="#534AB7">Service</text>

  <!-- Factus API -->
  <rect x="555" y="20" width="100" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="605" y="36" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Factus</text>
  <text x="605" y="54" text-anchor="middle" font-size="11" fill="#0F6E56">API / DIAN</text>

  <!-- ── Lifelines ── -->
  <line x1="90"  y1="64" x2="90"  y2="720" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="265" y1="64" x2="265" y2="720" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="445" y1="64" x2="445" y2="720" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="605" y1="64" x2="605" y2="720" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- ── [1] POST /send ── -->
  <rect x="30" y="90" width="120" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="90" y="107" text-anchor="middle" font-size="10" fill="#2C2C2A">POST /api/v1/invoices/send</text>
  <line x1="150" y1="103" x2="256" y2="103" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow-blue)"/>

  <!-- [2] validate -->
  <text x="268" y="136" font-size="10" fill="#888780">@Valid + enriquecerConDefaults()</text>
  <line x1="265" y1="128" x2="265" y2="150" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- [3] enviarFactura() -->
  <line x1="265" y1="162" x2="436" y2="162" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow-purple)"/>
  <text x="350" y="157" text-anchor="middle" font-size="10" fill="#534AB7">enviarFactura()</text>

  <!-- [4] token -->
  <text x="448" y="190" font-size="10" fill="#888780">crearHeaders() — Bearer token</text>
  <line x1="445" y1="182" x2="445" y2="202" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- [5] POST validate -->
  <line x1="445" y1="214" x2="596" y2="214" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow-teal)"/>
  <text x="522" y="209" text-anchor="middle" font-size="10" fill="#0F6E56">POST /v1/bills/validate</text>

  <!-- [6] alt 401 box -->
  <rect x="390" y="230" width="270" height="56" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="400" y="245" font-size="9" fill="#888780">alt  401 token expirado</text>
  <line x1="596" y1="256" x2="454" y2="256" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-teal)"/>
  <text x="527" y="251" text-anchor="middle" font-size="10" fill="#0F6E56">401 Unauthorized</text>
  <line x1="445" y1="264" x2="596" y2="264" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow-purple)"/>
  <text x="517" y="259" text-anchor="middle" font-size="10" fill="#534AB7">refrescarToken() → retry</text>

  <!-- [7] alt 409 box -->
  <rect x="390" y="296" width="270" height="56" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="400" y="311" font-size="9" fill="#888780">alt  409 sandbox bloqueado</text>
  <line x1="596" y1="322" x2="454" y2="322" stroke="#E24B4A" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-red)"/>
  <text x="527" y="317" text-anchor="middle" font-size="10" fill="#A32D2D">409 Conflict</text>
  <line x1="445" y1="330" x2="596" y2="330" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow-purple)"/>
  <text x="517" y="325" text-anchor="middle" font-size="10" fill="#534AB7">DELETE pendiente → retry</text>

  <!-- [8] 200 Factus -->
  <line x1="596" y1="366" x2="454" y2="366" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-teal)"/>
  <text x="527" y="361" text-anchor="middle" font-size="10" fill="#0F6E56">200 FactusApiResponse</text>

  <!-- [9] InvoiceResponse.from() -->
  <text x="448" y="392" font-size="10" fill="#888780">InvoiceResponse.from(response)</text>
  <line x1="445" y1="384" x2="445" y2="404" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- [10] return to controller -->
  <line x1="436" y1="416" x2="274" y2="416" stroke="#7F77DD" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-purple)"/>
  <text x="352" y="411" text-anchor="middle" font-size="10" fill="#534AB7">InvoiceResponse</text>

  <!-- [11] 200 to client -->
  <line x1="256" y1="442" x2="158" y2="442" stroke="#378ADD" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-blue)"/>
  <text x="207" y="437" text-anchor="middle" font-size="10" fill="#185FA5">200 OK + número DIAN</text>

  <!-- ── Divider PDF ── -->
  <line x1="40" y1="468" x2="640" y2="468" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="340" y="482" text-anchor="middle" font-size="10" fill="#888780">descarga de PDF</text>

  <!-- [12] GET /download-pdf -->
  <rect x="30" y="493" width="120" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="90" y="510" text-anchor="middle" font-size="10" fill="#2C2C2A">GET /download-pdf/{n}</text>
  <line x1="150" y1="506" x2="256" y2="506" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow-blue)"/>

  <!-- [13] descargarFacturaPdf() -->
  <line x1="265" y1="530" x2="436" y2="530" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow-purple)"/>
  <text x="350" y="525" text-anchor="middle" font-size="10" fill="#534AB7">descargarFacturaPdf()</text>

  <!-- [14] GET Factus -->
  <line x1="445" y1="554" x2="596" y2="554" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow-teal)"/>
  <text x="517" y="549" text-anchor="middle" font-size="10" fill="#0F6E56">GET /download-pdf/{n}</text>

  <!-- [15] base64 -->
  <line x1="596" y1="578" x2="454" y2="578" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-teal)"/>
  <text x="527" y="573" text-anchor="middle" font-size="10" fill="#0F6E56">{ pdf_base_64_encoded }</text>

  <!-- [16] decode -->
  <text x="448" y="602" font-size="10" fill="#888780">Base64.decode() → byte[]</text>
  <line x1="445" y1="594" x2="445" y2="614" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- [17] bytes to controller -->
  <line x1="436" y1="626" x2="274" y2="626" stroke="#7F77DD" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-purple)"/>
  <text x="352" y="621" text-anchor="middle" font-size="10" fill="#534AB7">byte[]</text>

  <!-- [18] PDF to client -->
  <line x1="256" y1="650" x2="158" y2="650" stroke="#378ADD" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-blue)"/>
  <text x="207" y="645" text-anchor="middle" font-size="10" fill="#185FA5">200 application/pdf</text>

  <!-- ── Legend ── -->
  <line x1="40" y1="690" x2="640" y2="690" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="50"  y1="710" x2="75"  y2="710" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow-blue)"/>
  <text x="80" y="714" font-size="10" fill="#5F5E5A">solicitud</text>
  <line x1="145" y1="710" x2="170" y2="710" stroke="#378ADD" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow-blue)"/>
  <text x="175" y="714" font-size="10" fill="#5F5E5A">respuesta</text>
  <line x1="255" y1="710" x2="280" y2="710" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="285" y="714" font-size="10" fill="#888780">flujo alternativo</text>
</svg>
