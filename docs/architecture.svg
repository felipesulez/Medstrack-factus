<svg width="680" height="780" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:Arial,sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="40" y="14" width="600" height="50" rx="8" fill="#042C53" fill-opacity="0.06"/>
  <text x="340" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="#042C53">MEDSTRACK BILLING · REQUEST SEQUENCE</text>
  <text x="340" y="53" text-anchor="middle" font-size="11" fill="#5F5E5A">Sequence Diagram — Invoice submission &amp; PDF download · end to end</text>

  <!-- Actor headers -->
  <rect x="30" y="76" width="116" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="88" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#2C2C2A">Client</text>
  <text x="88" y="110" text-anchor="middle" font-size="10" fill="#5F5E5A">Medstrack System</text>

  <rect x="192" y="76" width="148" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="266" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#0C447C">InvoiceController</text>
  <text x="266" y="110" text-anchor="middle" font-size="10" fill="#185FA5">REST Layer</text>

  <rect x="380" y="76" width="136" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="448" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#3C3489">FactusService</text>
  <text x="448" y="110" text-anchor="middle" font-size="10" fill="#534AB7">Business Layer</text>

  <rect x="558" y="76" width="100" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="608" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#085041">Factus API</text>
  <text x="608" y="110" text-anchor="middle" font-size="10" fill="#0F6E56">DIAN · External</text>

  <!-- Lifelines -->
  <line x1="88"  y1="122" x2="88"  y2="720" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="266" y1="122" x2="266" y2="720" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="448" y1="122" x2="448" y2="720" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="608" y1="122" x2="608" y2="720" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- [1] POST /send -->
  <rect x="30" y="142" width="116" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="88" y="159" text-anchor="middle" font-size="9" fill="#2C2C2A">POST /api/v1/invoices/send</text>
  <line x1="146" y1="155" x2="258" y2="155" stroke="#378ADD" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <!-- [2] validate -->
  <text x="270" y="186" font-size="9" fill="#888780">@Valid + enriquecerConDefaults()</text>
  <line x1="266" y1="178" x2="266" y2="196" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- [3] enviarFactura() -->
  <line x1="266" y1="208" x2="440" y2="208" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <text x="352" y="202" text-anchor="middle" font-size="9" fill="#534AB7">enviarFactura()</text>

  <!-- [4] token -->
  <text x="452" y="234" font-size="9" fill="#888780">crearHeaders() — Bearer token</text>
  <line x1="448" y1="226" x2="448" y2="244" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- [5] POST validate -->
  <line x1="448" y1="256" x2="600" y2="256" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arr-teal)"/>
  <text x="526" y="250" text-anchor="middle" font-size="9" fill="#0F6E56">POST /v1/bills/validate</text>

  <!-- [6] alt 401 box -->
  <rect x="392" y="272" width="272" height="58" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="404" y="288" font-size="8" fill="#888780">alt  401 token expired</text>
  <line x1="600" y1="298" x2="456" y2="298" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr-teal)"/>
  <text x="530" y="293" text-anchor="middle" font-size="9" fill="#0F6E56">401 Unauthorized</text>
  <line x1="448" y1="306" x2="600" y2="306" stroke="#7F77DD" stroke-width="1" marker-end="url(#arr-purple)"/>
  <text x="522" y="301" text-anchor="middle" font-size="9" fill="#534AB7">refreshToken() → retry</text>

  <!-- [7] alt 409 box -->
  <rect x="392" y="340" width="272" height="58" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="404" y="356" font-size="8" fill="#888780">alt  409 sandbox blocked range</text>
  <line x1="600" y1="366" x2="456" y2="366" stroke="#E24B4A" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>
  <text x="530" y="361" text-anchor="middle" font-size="9" fill="#A32D2D">409 Conflict</text>
  <line x1="448" y1="374" x2="600" y2="374" stroke="#7F77DD" stroke-width="1" marker-end="url(#arr-purple)"/>
  <text x="522" y="369" text-anchor="middle" font-size="9" fill="#534AB7">DELETE pending → retry</text>

  <!-- [8] 200 Factus -->
  <line x1="600" y1="410" x2="456" y2="410" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-teal)"/>
  <text x="530" y="405" text-anchor="middle" font-size="9" fill="#0F6E56">200 FactusApiResponse</text>

  <!-- [9] map response -->
  <text x="452" y="434" font-size="9" fill="#888780">InvoiceResponse.from(response)</text>
  <line x1="448" y1="426" x2="448" y2="444" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- [10] return to controller -->
  <line x1="440" y1="456" x2="274" y2="456" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-purple)"/>
  <text x="356" y="451" text-anchor="middle" font-size="9" fill="#534AB7">InvoiceResponse</text>

  <!-- [11] 200 to client -->
  <line x1="258" y1="480" x2="146" y2="480" stroke="#378ADD" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-blue)"/>
  <text x="202" y="475" text-anchor="middle" font-size="9" fill="#185FA5">200 OK + DIAN invoice number</text>

  <!-- Divider PDF -->
  <line x1="40" y1="506" x2="640" y2="506" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="340" y="520" text-anchor="middle" font-size="9" fill="#888780">PDF DOWNLOAD FLOW</text>

  <!-- [12] GET /download-pdf -->
  <rect x="30" y="530" width="116" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="88" y="547" text-anchor="middle" font-size="9" fill="#2C2C2A">GET /download-pdf/{n}</text>
  <line x1="146" y1="543" x2="258" y2="543" stroke="#378ADD" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <!-- [13] descargarFacturaPdf() -->
  <line x1="266" y1="566" x2="440" y2="566" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <text x="352" y="560" text-anchor="middle" font-size="9" fill="#534AB7">downloadInvoicePdf()</text>

  <!-- [14] GET Factus -->
  <line x1="448" y1="588" x2="600" y2="588" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arr-teal)"/>
  <text x="526" y="582" text-anchor="middle" font-size="9" fill="#0F6E56">GET /v1/bills/download-pdf/{n}</text>

  <!-- [15] base64 -->
  <line x1="600" y1="610" x2="456" y2="610" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-teal)"/>
  <text x="530" y="605" text-anchor="middle" font-size="9" fill="#0F6E56">{ pdf_base_64_encoded }</text>

  <!-- [16] decode -->
  <text x="452" y="632" font-size="9" fill="#888780">Base64.decode() → byte[]</text>
  <line x1="448" y1="624" x2="448" y2="642" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- [17] bytes to controller -->
  <line x1="440" y1="654" x2="274" y2="654" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-purple)"/>
  <text x="356" y="649" text-anchor="middle" font-size="9" fill="#534AB7">byte[]</text>

  <!-- [18] PDF to client -->
  <line x1="258" y1="676" x2="146" y2="676" stroke="#378ADD" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-blue)"/>
  <text x="202" y="671" text-anchor="middle" font-size="9" fill="#185FA5">200 application/pdf</text>

  <!-- Legend -->
  <line x1="40" y1="698" x2="640" y2="698" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="50"  y1="716" x2="75"  y2="716" stroke="#378ADD" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="80" y="720" font-size="9" fill="#5F5E5A">request</text>
  <line x1="138" y1="716" x2="163" y2="716" stroke="#378ADD" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-blue)"/>
  <text x="168" y="720" font-size="9" fill="#5F5E5A">response</text>
  <line x1="240" y1="716" x2="265" y2="716" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="270" y="720" font-size="9" fill="#888780">alternative flow</text>
  
  <rect x="0" y="742" width="680" height="38" fill="#042C53"/>
  <text x="340" y="766" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">© 2026 Felipe Sulez  ·  Medstrack Billing  ·  All rights reserved</text>
</svg>
