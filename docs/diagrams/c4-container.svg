  <text x="316" y="414" text-anchor="middle" font-size="11" font-weight="600" fill="#085041">TokenInterceptor</text>
  <text x="316" y="429" text-anchor="middle" font-size="10" fill="#0F6E56">Auto-refreshes Bearer token on 401 · transparent retry</text>

