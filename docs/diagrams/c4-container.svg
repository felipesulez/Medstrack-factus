  <rect x="168" y="236" width="296" height="26" rx="10" fill="#534AB7"/>
  <rect x="168" y="250" width="296" height="12" fill="#534AB7"/>
  <text x="316" y="253" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Business Service  ·  [Container: Spring Bean]</text>
  <text x="316" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#3C3489">FactusService</text>
  <text x="316" y="297" text-anchor="middle" font-size="10" fill="#534AB7">Invoice logic · smart defaults · 409 auto-cleanup</text>
  <text x="316" y="312" text-anchor="middle" font-size="10" fill="#534AB7">OAuth2 token management · NIT DV algorithm</text>

