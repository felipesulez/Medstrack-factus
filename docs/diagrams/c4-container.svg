  <rect x="56" y="538" width="14" height="14" rx="3" fill="#534AB7"/>
  <text x="76" y="549" font-size="10" fill="#2C2C2A">Business logic — FactusService</text>

  <rect x="56" y="560" width="14" height="14" rx="3" fill="#0F6E56"/>
