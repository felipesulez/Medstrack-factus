  <rect x="220" y="334" width="192" height="16" rx="3" fill="white" fill-opacity="0.92"/>
  <text x="316" y="345" text-anchor="middle" font-size="9" fill="#534AB7">uses to authenticate outbound requests</text>

  <!-- Arrow: FactusService → Factus API -->
  <path d="M464 278 L492 278 L492 226 L522 226" fill="none" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <rect x="468" y="248" width="80" height="30" rx="4" fill="white" fill-opacity="0.92"/>
  <text x="508" y="259" text-anchor="middle" font-size="9" fill="#534AB7">HTTPS / REST</text>
  <text x="508" y="271" text-anchor="middle" font-size="9" fill="#534AB7">POST /v1/bills/validate</text>

  <!-- Arrow: Factus API → DIAN -->
  <line x1="590" y1="276" x2="590" y2="320" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arr-coral)"/>
  <rect x="596" y="288" width="56" height="28" rx="4" fill="white" fill-opacity="0.92"/>
