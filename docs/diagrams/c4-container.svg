  <line x1="90" y1="262" x2="166" y2="198" stroke="#888780" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <rect x="82" y="216" width="64" height="30" rx="4" fill="white" fill-opacity="0.92"/>
  <text x="114" y="227" text-anchor="middle" font-size="9" fill="#5F5E5A">HTTPS / JSON</text>
  <text x="114" y="239" text-anchor="middle" font-size="9" fill="#5F5E5A">POST /send</text>

