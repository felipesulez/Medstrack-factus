  <rect x="300" y="538" width="14" height="14" rx="3" fill="#854F0B"/>
  <text x="320" y="549" font-size="10" fill="#2C2C2A">External system — DIAN (Government)</text>

  <rect x="300" y="560" width="14" height="14" rx="3" fill="#D3D1C7"/>
  <text x="320" y="571" font-size="10" fill="#2C2C2A">External actor — client system</text>

  <rect x="520" y="514" width="40" height="14" rx="3" fill="none" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 3"/>
