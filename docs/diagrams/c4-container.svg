  <rect x="168" y="124" width="296" height="12" fill="#185FA5"/>
  <text x="316" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">REST API  ·  [Container: Spring Boot]</text>
  <text x="316" y="156" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">InvoiceController</text>
  <text x="316" y="171" text-anchor="middle" font-size="10" fill="#185FA5">Receives HTTP requests · validates · delegates</text>
  <text x="316" y="184" text-anchor="middle" font-size="10" fill="#185FA5">Java 17 · Swagger UI · Spring Validation</text>

