name: Generate Diagrams

on:
  push:
    branches:
      - main
      - feature/c4-plantuml-actions
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PlantUML
        run: sudo apt-get update && sudo apt-get install -y plantuml

      - name: Generate diagrams
        run: |
          mkdir -p docs/diagrams
          plantuml -tsvg docs/diagrams/c4-container.puml

      - name: Commit diagrams
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add docs/diagrams/*.svg
          git commit -m "chore: auto-generate diagrams" || echo "No    
          changes"
          git push
