- name: Generate SVG
        run: |
          # Descargar el JAR (esto es rápido, ~50MB)
          wget -q https://github.com/plantuml/plantuml/releases/download/v1.2024.3/plantuml-1.2024.3.jar -O plantuml.jar
          
          # Ejecutar directamente (Java ya está en el runner)
          java -jar plantuml.jar -tsvg docs/diagrams/c4-container.puml