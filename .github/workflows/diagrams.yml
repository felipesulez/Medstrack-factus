name: Generate diagrams

on:
  push:
    branches: [ main, feature/c4-plantuml-actions ]
    paths:
      - 'docs/diagrams/**.puml'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate SVG with PlantUML JAR
        run: |
          # 1. Descargar la versión oficial (la más compatible con C4)
          curl -L https://github.com/plantuml/plantuml/releases/download/v1.2024.3/plantuml-1.2024.3.jar -o plantuml.jar
          
          # 2. Ejecutar usando Java directamente
          java -jar plantuml.jar -tsvg docs/diagrams/c4-container.puml

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams/c4-container.svg
          if git diff --cached --quiet; then
            echo "No hay cambios en el diagrama."
          else
            git commit -m "ci: update c4 diagram [skip ci]"
            git push
          fi